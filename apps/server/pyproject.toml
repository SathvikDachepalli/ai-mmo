[project]
name = "ai-mmo-server"
version = "0.1.0"
description = "AI-native multiplayer text RPG backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-socketio[asyncio_client]>=5.11",
    "pydantic>=2.8",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "redis>=5.0",
    "arq>=0.26",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "langgraph>=1.2.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
